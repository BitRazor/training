apply plugin: 'com.android.application'

/* The APK's version follows the web files' version.json (written by tools/make-version.mjs):
   2026.11.04.1 -> versionName "2026.11.04.1", versionCode 26110401. */
def webVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../version.json")).version
def vp = webVersion.tokenize('.').collect { it as int }
if (vp.size() != 4 || vp[3] > 99) throw new GradleException("version.json version must look like 2026.11.04.1 (N up to 99), got " + webVersion)
def apkVersionCode = (vp[0] - 2000) * 1000000 + vp[1] * 10000 + vp[2] * 100 + vp[3]

/* Release signing. android/keystore.properties (never committed) holds either storeFile, storePassword,
   keyAlias, keyPassword, or a single line  signingProperties=<path of such a file kept outside the repo>. */
def signing = new Properties()
def signingFile = rootProject.file("keystore.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signing.load(it) }
    if (signing.getProperty("signingProperties")) {
        def outside = new File(signing.getProperty("signingProperties"))
        if (!outside.exists()) throw new GradleException("signing properties not found: " + outside)
        outside.withInputStream { signing.load(it) }
    }
}
def canSign = signing.getProperty("storeFile") != null

android {
    namespace = "io.github.bitrazor.training"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.bitrazor.training"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode apkVersionCode
        versionName webVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSign) {
                storeFile file(signing.getProperty("storeFile"))
                storePassword signing.getProperty("storePassword")
                keyAlias signing.getProperty("keyAlias")
                keyPassword signing.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSign) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
